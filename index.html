    ...EXPENSES.filter(e => cardOf(e) || e.status === 'Done').map(e => ({ d: iso(e.date), f: () => postExpense(e) })),
    ...BILLS.filter(b => b.status !== 'To approve').map(b => ({ d: iso(b.received), f: () => postBill(b) })),
    ...NONCASH.filter(g => g.kind !== 'services').map(g => ({ d: iso(g.date), f: () => postNonCash(g) })),
    ...NONCASH.filter(g => g.sold).map(g => ({ d: iso(g.sold.date), f: () => postNcSale(g) })),
    ...RENTALS.filter(r => r.deposit && r.deposit.received).map(r => ({ d: iso(r.deposit.received), f: () => postRentalDeposit(r, 'receive', iso(r.deposit.received), cents(r.deposit.amount)) })),
    ...RENTALS.flatMap(r => r.payments.map(p => ({ d: iso(p.date), f: () => postRentalPayment(r, p) }))),
    ...PARTNERS.flatMap(p => p.payments.filter(x => !x.checkId).map(x => ({ d: iso(x.date), f: () => postPartnerPayment(p, x) }))),
    ...BILLS.filter(b => b.status === 'Paid').map(b => ({ d: iso(b.paidOn), f: () => payBill(b, { method: b.method, date: iso(b.paidOn) }) })),
    { d: thisMonth, f: () => STAFF.length && BOOKS.post(R.payroll({ date: thisMonth, memo: `Payroll ${new Date(TODAY).toLocaleDateString('en-US', { month: 'long' })}${INTEG.payroll ? ` (from ${INTEG.payroll})` : ''}`, source: { type: 'payroll', id: thisMonth }, rows: payrollRows(thisMonth), bank: BANK }), ME) },
  ];
  events.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : 0).forEach(x => x.f());

  // Recurring payments set to pay automatically go out on their dates (and the tithe on the tithe, if it's automatic)
  SCHEDULES.filter(x => x.auto).forEach(x => dueNow(x).forEach(d => runSchedule(x, d, 'auto')));
  recognizeEvents(); autoDepreciate();
  if (TOT() && TOT().auto) totDue().forEach(postTot);
  // Sample checks already written: link each one to the entry that paid it (so it can be voided)
  CHECKS.forEach(c => { const e = EXPENSES.find(x => x.paid === `Check #${c.no}`); if (e && e.je) c.je = e.je; });
  // The bank's own statement: it has a few lines the books don't yet, and hasn't seen some
  // checks clear. The Bank match-up page explains the gap.
  syncFromBooks();
  BANKS.forEach(b => { if (b.bank !== null) b.bank = Math.round((b.book + sum(((H || {}).bankStatementAdjust || {})[b.code] || [])) * 100) / 100; });
})();
// Payroll lines for a payday: each person's pay split by the allocation in effect that day (engine does the cents)
function PAY_BUDGET() { return (PROJECTS.find(p => /payroll|staff/i.test(p.name)) || PROJECTS[0]).name; }   // functions, not consts: the seed above uses them
function allocAt(st, date) { const a = (st.alloc || []).filter(x => x.from <= date).sort((x, y) => x.from < y.from ? 1 : -1)[0]; return a ? a.lines : [{ proj: PAY_BUDGET(), pct: 100 }]; }
function payrollRows(date) {
  return R.payrollRows(STAFF.map(st => ({ gross: cents(st.gross), clergy: st.type === 'Clergy',
    allocation: allocAt(st, date).map(l => ({ project: l.proj, fund: project(l.proj).fund, pct: l.pct })) })), { housingShare: POL.housingShare || 0 });
}

// Every number the pages show comes from here — added up from the ledger, never typed in.
function syncFromBooks() {
  const neg = n => 0 - n;
  FUNDS.forEach(f => {
    if (!BOOKS.fund(f.id)) return;
    const inc = neg(BOOKS.balance({ type: 'income', fund: f.id })), out = BOOKS.balance({ type: 'expense', fund: f.id });
    const start = neg(BOOKS.balance({ account: '3000', fund: f.id }));
    f.bal = (start + inc - out) / 100; f.ytdIn = inc / 100; f.ytdOut = out / 100;
  });
  BANKS.forEach(b => { b.book = BOOKS.natural(b.code) / 100; });
  CARDS.forEach(c => { const a = CARD_ACCT[c.last4]; c.bal = a ? BOOKS.natural(a) / 100 : 0; });
  GIVING.forEach(g => { g.ytd = BOOKS.natural(g.account) / 100; });
}
const monthTotal = type => {   // this month's income or spending, leaving out money moved between funds
  return BOOKS.accounts.filter(a => a.type === type && a.sub !== 'transfer').reduce((s, a) => s + BOOKS.natural(a.code, { from: MONTH_FROM, through: MONTH_TO }), 0) / 100;
};

const fc = n => fmt(n / 100);          // cents → "$1,234.56"
const fundNames = () => BOOKS.funds.map(f => f.name);
let booksTab = 'sheet';
V.books = () => {
  const h = BooksReports.health(BOOKS);
  const tabs = [['sheet', 'Balance sheet'], ['activity', `${MONTH} activity`], ['cashflow', 'Cash flows'], ['functional', 'Functional expenses'], ['journal', 'Journal'], ['trial', 'Trial balance'], ['history', 'Change history']];
  return `
  <div class="vhead"><div><h1>The books</h1><p>Everything above is kept here as real double-entry accounting. Every fund balances on its own, nothing can be edited once it's posted, and closed months are locked.</p></div>
    <div class="acts"><button class="btn" data-glexport>⬇ General ledger (Excel)</button><button class="btn" data-open="lockmonth">🔒 Lock a month</button></div></div>
  <div class="grid g2 mb">
    <div class="card"><h2>Health check</h2><div class="sub">These must always be true</div>
      ${h.checks.map(c => `<div class="chk ${c.ok ? 'done' : ''}"><span class="box">${c.ok ? '✓' : '!'}</span><span>${esc(c.text)}</span></div>`).join('')}
      ${window.CLOUD ? `<div class="chk ${CLOUD.chain.ok ? 'done' : ''}"><span class="box">${CLOUD.chain.ok ? '✓' : '!'}</span><span>${CLOUD.chain.ok ? 'Every saved entry still matches its fingerprint (nothing was changed outside the app)' : `Entry ${esc(CLOUD.chain.brokenAt)} no longer matches its fingerprint — it was changed outside the app`}</span></div>` : ''}</div>
    <div class="card"><h2>At a glance</h2><div class="sub">${BOOKS.entries.length} entries · locked through ${BOOKS.lockedThrough ? new Date(BOOKS.lockedThrough + 'T12:00:00').toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) : 'nothing yet'}</div>
      <div class="example">${[...SETUP.banks.filter(b => b.kind !== 'cash').map(b => [b.code, b.name]), ...SETUP.cards.slice(0, 1).map(c => [c.code, `Owed on ${c.name}`])].map(([c, n]) => `<span>${n}</span><span class="num"><b>${fc(BOOKS.natural(c))}</b></span>`).join('')}
      <span>Owed on all cards</span><span class="num"><b>${fc(BOOKS.accounts.filter(a => a.sub === 'card').reduce((s, a) => s + BOOKS.natural(a.code), 0))}</b></span></div></div>
  </div>
  <div class="seg">${tabs.map(([k, l]) => `<button class="${booksTab === k ? 'active' : ''}" data-btab="${k}">${l}</button>`).join('')}</div>
  <div class="card">${({ sheet: bookSheet, activity: bookActivity, cashflow: bookCashFlows, functional: bookFunctional, journal: bookJournal, trial: bookTrial, history: bookHistory })[booksTab]()}</div>`;
};
function bookSheet() {
  const bs = BooksReports.balanceSheet(BOOKS), cols = [...bs.funds, { ...bs.total, name: 'Total' }];
  const codes = type => BOOKS.accounts.filter(a => a.type === type && cols.some(c => (type === 'asset' ? c.assets : c.liabilities).some(r => r.code === a.code)));
  const cell = (c, type, code) => { const r = (type === 'asset' ? c.assets : c.liabilities).find(x => x.code === code); return r ? fc(r.amount) : '—'; };
  const head = `<tr><th></th>${cols.map(c => `<th class="r">${esc(c.name)}</th>`).join('')}</tr>`;
  const sec = (title, type, total) => `<tr><td colspan="${cols.length + 1}" class="sech">${title}</td></tr>` +
    codes(type).map(a => `<tr><td>${esc(a.name)}</td>${cols.map(c => `<td class="r num">${cell(c, type, a.code)}</td>`).join('')}</tr>`).join('') +
    `<tr class="tot"><td>Total ${title.toLowerCase()}</td>${cols.map(c => `<td class="r num">${fc(c[total])}</td>`).join('')}</tr>`;
  return `<h2>Balance sheet</h2><div class="sub">What each fund owns and owes today (Statement of Financial Position)</div>
    <div class="tablewrap"><table class="t">${head}${sec('What we have', 'asset', 'totalAssets')}${sec('What we owe', 'liability', 'totalLiabilities')}
    <tr><td colspan="${cols.length + 1}" class="sech">Fund balance</td></tr>
    <tr><td>Start of year</td>${cols.map(c => `<td class="r num">${fc(c.closed)}</td>`).join('')}</tr>
    <tr><td>This year so far</td>${cols.map(c => `<td class="r num">${fc(c.thisYear)}</td>`).join('')}</tr>
    <tr class="tot"><td>Fund balance</td>${cols.map(c => `<td class="r num"><b>${fc(c.fundBalance)}</b></td>`).join('')}</tr></table></div>
    <div class="muted small" style="margin-top:10px">${bs.balanced ? '✓ In every column, what we have = what we owe + fund balance.' : '⚠ Something doesn\'t add up.'}</div>`;
}
function bookActivity() {
  const a = BooksReports.activities(BOOKS, { from: MONTH_FROM, to: MONTH_TO });
  const names = [...new Set(a.funds.flatMap(f => [...f.income, ...f.expenses].map(r => r.code)))];
  const row = (f, code) => { const r = [...f.income, ...f.expenses].find(x => x.code === code); return r ? fc(r.amount) : '—'; };
  return `<h2>${MONTH} activity</h2><div class="sub">What came in and went out, by fund (Statement of Activities)</div>
    <div class="grid g2 mb" style="gap:12px">
      <div class="section" style="margin:0"><h3>Without donor restrictions</h3><div class="example">
        <span>Came in</span><span class="num">${fc(a.without.income)}</span><span>Released from restricted funds</span><span class="num">${fc(a.without.released)}</span>
        <span>All spending</span><span class="num">${fc(0 - a.without.expenses)}</span><span><b>Change</b></span><span class="num"><b>${fc(a.without.change)}</b></span></div></div>
      <div class="section" style="margin:0"><h3>With donor restrictions</h3><div class="example">
        <span>Came in</span><span class="num">${fc(a.with.income)}</span><span>Released (spent on its purpose)</span><span class="num">${fc(a.with.released)}</span>
        <span>&nbsp;</span><span></span><span><b>Change</b></span><span class="num"><b>${fc(a.with.change)}</b></span></div></div></div>
    <div class="tablewrap"><table class="t"><tr><th></th>${a.funds.map(f => `<th class="r">${esc(f.name)}</th>`).join('')}</tr>
      ${names.map(code => `<tr><td>${esc(BOOKS.account(code).name)}</td>${a.funds.map(f => `<td class="r num">${row(f, code)}</td>`).join('')}</tr>`).join('')}
      <tr class="tot"><td>Change in fund balance</td>${a.funds.map(f => `<td class="r num"><b>${fc(f.change)}</b></td>`).join('')}</tr></table></div>`;
}
function bookJournal() {
  const fundName = id => BOOKS.fund(id).name;
  return `<h2>Journal</h2><div class="sub">Every entry, newest first. Entries can't be edited or deleted — a mistake is fixed by reversing it.</div>
    ${BOOKS.entries.slice().reverse().map(e => { const tot = e.lines.reduce((s, l) => s + l.debit, 0), rev = BOOKS.reversalOf(e.id);
      return `<details class="je"><summary><span class="mono small">${e.id}</span><span class="muted small">${e.date}</span><span class="nm">${esc(e.memo)}${rev ? ' <span class="pill gray">Reversed</span>' : ''}${e.reverses ? ' <span class="pill gold">Correction</span>' : ''}</span>${entryFiles(e).length ? `<span class="muted small">📎 ${entryFiles(e).length}</span>` : ''}<span class="num"><b>${fc(tot)}</b></span></summary>
        <table class="t" style="margin:6px 0 4px"><tr><th>Account</th><th>Fund</th><th>Budget</th><th class="r">Debit</th><th class="r">Credit</th></tr>
        ${e.lines.map(l => `<tr><td>${l.account} · ${esc(BOOKS.account(l.account).name)}</td><td>${esc(fundName(l.fund))}</td><td class="small muted">${esc(l.project || '')}</td><td class="r num">${l.debit ? fc(l.debit) : ''}</td><td class="r num">${l.credit ? fc(l.credit) : ''}</td></tr>`).join('')}</table>
        <div class="muted small">Posted by ${esc(e.postedBy)}${e.source ? ` · from ${esc(e.source.type.replace('_', ' '))}` : ''} · <button class="linkbtn" data-entryfiles="${e.id}">📎 Files${entryFiles(e).length ? ` (${entryFiles(e).length})` : ''}</button>${!rev && !e.reverses && !BOOKS.isLocked(e.date) ? ` · <button class="linkbtn" data-reverse="${e.id}">Reverse this entry</button>` : ''}${BOOKS.isLocked(e.date) ? ' · 🔒 locked month' : ''}</div></details>`; }).join('')}`;
}
function bookTrial() {
  const tb = BooksReports.trialBalance(BOOKS);
  return `<h2>Trial balance</h2><div class="sub">Every account's balance. The two columns must match.</div>
    <div class="tablewrap"><table class="t"><tr><th>Account</th><th class="r">Debit</th><th class="r">Credit</th></tr>
    ${tb.rows.map(r => `<tr><td>${r.code} · ${esc(r.name)}</td><td class="r num">${r.debit ? fc(r.debit) : ''}</td><td class="r num">${r.credit ? fc(r.credit) : ''}</td></tr>`).join('')}
    <tr class="tot"><td>Total ${tb.balanced ? '✓' : '⚠'}</td><td class="r num">${fc(tb.debit)}</td><td class="r num">${fc(tb.credit)}</td></tr></table></div>`;
}
function bookHistory() {
  return `<h2>Change history</h2><div class="sub">Who did what, and when. This list can only grow.</div>
    ${BOOKS.audit.filter(a => a.by !== 'setup').slice().reverse().map(a => `<div class="fund" style="padding:8px 0"><div class="nm" style="font-weight:500">${esc(({ post: 'Posted', lock: 'Locked the books through', unlock: 'Reopened', add_fund: 'Added fund', add_account: 'Added account' })[a.action] || a.action)} ${esc(a.entry || a.through || a.name || '')}<small>${esc(a.memo || a.reason || '')}</small></div><div class="muted small">${esc(a.by)}</div></div>`).join('')}`;
}

P.reverse = id => {
  const e = BOOKS.get(id);
  return {
    kicker: 'Journal',
    body: `<h2>Reverse ${e.id}</h2><p class="lead">${esc(e.memo)}. A mirror-image entry cancels it out. The original stays in the journal so the history is complete.</p>
      <div class="f"><label>Why</label><input id="revWhy" placeholder="e.g. Charged to the wrong fund"></div>
      <div class="f"><label>Date of the correction</label><input id="revDate" type="date" value="${e.date}"></div>`,
    actions: `<button class="btn" data-close>Cancel</button><button class="btn bad" id="revGo">Reverse it</button>`,
    init() { $('#revGo').onclick = () => { try { BOOKS.reverse(id, { reason: $('#revWhy').value.trim(), date: $('#revDate').value, by: ME }); closePanel(); render(); toast(`${id} reversed`); } catch (err) { toast(err.message); } }; },
  };
};
P.lockmonth = () => ({
  kicker: 'The books',
  body: `<h2>Lock a month</h2><p class="lead">Once a month is locked, nothing can be added or changed in it. Corrections go into the next open month. Lock a month after the bank match-up and the month-end checklist are done.</p>
    <div class="f"><label>Lock everything through</label><select id="lockThru"><option value="${isoOf(PREV_MONTH_END)}">${PREV_MONTH_END.toLocaleDateString('en-US', { month: 'long', day: 'numeric' })}</option><option value="${MONTH_TO}">${MONTH} ${+MONTH_TO.slice(8)}</option></select></div>
    <div class="note gold">Currently locked through ${BOOKS.lockedThrough || 'nothing'}.</div>`,
  actions: `<button class="btn" data-close>Cancel</button><button class="btn primary" id="lockGo">Lock</button>`,
  init() { $('#lockGo').onclick = () => {
    const thru = $('#lockThru').value, behind = SETUP.banks.filter(b => b.kind !== 'cash' && !RECONS.some(r => r.account === b.code && r.through >= thru));
    if (behind.length && !confirm(`${andList(behind.map(b => b.name))} ${behind.length > 1 ? "aren't" : "isn't"} reconciled through that date yet. Lock anyway?`)) return;
    try { BOOKS.lock(thru, ME); closePanel(); render(); toast('Books locked'); } catch (err) { toast(err.message); } }; },
});
// Post safely from the mockup's buttons: a refusal from the books shows as a message, never a crash.
// Everything that isn't the ledger or the setup: what the cloud version saves as everyday work
function workspaceState() {
  return { payouts: PAYOUTS, cash: CASH, registrations: REG, requests: REQUESTS, subscriptions: SUBS, inbox: INBOX, bankLines: BANKLINES, staff: STAFF, checks: CHECKS, vendors: VENDORS, bills: BILLS,
    commitments: COMMITS, pledgeCampaigns: PCAMPS, pledges: PLEDGES, schedules: SCHEDULES, nonCash: NONCASH, donors: DONORS, rentals: RENTALS, partners: PARTNERS, pushes: PUSHES, assets: ASSETS, statementThrough: SAMPLE.statementThrough, payrollSchedule: SAMPLE.payrollSchedule,
    app: { recons: RECONS, cleared: Object.fromEntries([...CLEARED].map(([k, v]) => [k, [...v]])), packets: PACKETS, boardNotes: BOARD_NOTES, plan: PLAN,
      titheChecks: TOTQ, boardDecide: BOARD_DECIDE, kbSwitch: SWITCH, imports: IMPORTS.slice(0, 100), qbTypes: QB_TYPES_SEEN, outbox: OUTBOX.slice(-200), sent: [...SENT], lastWeekly, setupLog: SETUP_LOG, files: FILES.toJSON(), sampleFiles: [...SAMPLE_FILES], xSeq,
      bankStatement: Object.fromEntries(BANKS.filter(b => b.bank !== null).map(b => [b.code, b.bank])) } };
}
// One file with everything, for moving a church's books into the cloud version (checked again on the way in)
function exportForCloud() {
  const st = currentSetup(); delete st.currentUser;
  return { format: 'church-books-export', version: 1, exportedAt: new Date().toISOString(), church: SETUP.name, setup: st, lockedThrough: BOOKS.lockedThrough,
    entries: BOOKS.entries.map(e => ({ date: e.date, memo: e.memo, source: e.source, reverses: e.reverses, lines: e.lines, postedAt: e.postedAt, postedBy: e.postedBy })),
    workspace: Object.fromEntries(Object.entries(workspaceState()).map(([k, v]) => [k, JSON.stringify(v === undefined ? null : v)])), expenses: EXPENSES };
}
function book(fn, ok) { try { fn(); if (ok) toast(ok); return true; } catch (err) { toast('Not posted: ' + err.message); return false; } }

if (!window.CLOUD) OUTBOX.push({ id: 'n-prev', rule: 'weekly', to: recipients((NOTIFY.weekly || {}).to || []), via: 'email', subject: `${SETUP.shortName} weekly money summary`, body: '<p>(Last week\'s summary.)</p>', at: new Date(lastWeekly || TODAY).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }), status: 'Sent' });
runNotifications(`${TODAY}T06:00:00`, true);
render();
if (window.CLOUD) Cloud.attach({ setup: currentSetup, workspace: workspaceState, expenses: () => EXPENSES, lastChange: () => (SETUP_LOG[SETUP_LOG.length - 1] || {}).what || 'Setup changed',
  adopt: e => { Cloud.replaying = true; try { BOOKS.post({ date: e.date, memo: e.memo, source: e.source, reverses: e.reverses, lines: e.lines, postedAt: e.postedAt }, e.postedBy); } finally { Cloud.replaying = false; } render(); } });
if (window.CLOUD && CLOUD.role === 'viewer') document.body.classList.add('readonly');
</script>
<script>
  function startApp() { const s = document.createElement('script'); s.textContent = document.getElementById('appjs').textContent; document.body.appendChild(s); }
  if (window.CLOUD_MODE) Cloud.start().then(startApp); else startApp();
</script>
