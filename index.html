<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church Books — Mockup</title>
<meta name="theme-color" content="#2557b8">
<link rel="stylesheet" href="../rcc-ui.css">
<link rel="stylesheet" href="shared/rcc-ui.css">   <!-- a copy, for when this folder is used on its own (outside the RCC App Hub) -->
<style>
  /* ---------- layout: sidebar + main ---------- */
  .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .side { position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--line); background: rgba(255,255,255,.45); display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .side .rcc-brand { padding: 4px 8px 18px; }
  .side h6 { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); padding: 14px 10px 6px; }
  .side a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--ink-2); text-decoration: none; font-size: 14px; font-weight: 500; transition: background .2s var(--ease), color .2s; }
  .side a svg { width: 18px; height: 18px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .side a:hover { background: rgba(37,87,184,.07); color: var(--blue-ink); }
  .side a.active { background: var(--blue); color: #fff; }
  .side a .badge { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--red-soft); color: var(--red-ink); border-radius: 999px; padding: 1px 7px; }
  .side a.active .badge { background: rgba(255,255,255,.25); color: #fff; }
  .side .foot { margin-top: auto; padding: 14px 10px 0; font-size: 12px; color: var(--ink-3); }

  .main { min-width: 0; }
  .topbar { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 clamp(16px, 3vw, 36px); background: rgba(246,242,234,.85); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
  .topbar .search { flex: 1; max-width: 380px; }
  .topbar .search input { width: 100%; }
  .mock { font-size: 12px; font-weight: 600; color: var(--gold-ink); background: var(--gold-soft); border-radius: 999px; padding: 4px 11px; white-space: nowrap; }
  .newwrap { margin-left: auto; position: relative; }
  /* The New menu lives at the top level of the page (moved there on start-up) and is placed under its button, so nothing on the page can cover it */
  .menu { position: fixed; width: 270px; max-width: calc(100vw - 24px); overflow-y: auto; overscroll-behavior: contain; background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-2); padding: 6px; display: none; z-index: 75; }
  .menu.show { display: block; animation: fade .15s; }
  .menu button { display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; border: none; background: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--ink); }
  .menu button small { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
  .menu button:hover { background: var(--bg); }
  .navbtn, .navscrim { display: none; }
  .navbtn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  .view { max-width: 1120px; margin: 0 auto; padding: 30px clamp(16px, 3vw, 36px) 90px; animation: rise .35s var(--ease) both; }
  .vhead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .vhead h1 { font-size: clamp(28px, 3.6vw, 36px); }
  .vhead p { color: var(--ink-2); margin-top: 4px; max-width: 62ch; }
  .vhead .acts { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------- building blocks ---------- */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-1); padding: 20px 22px; }
  .card h2 { font-size: 20px; margin-bottom: 4px; }
  .card .sub { color: var(--ink-3); font-size: 13px; margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .card-head a, .linkbtn { font-size: 13px; font-weight: 600; color: var(--blue); text-decoration: none; background: none; border: none; cursor: pointer; padding: 0; }
  .grid { display: grid; gap: 18px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .mb { margin-bottom: 18px; }

  .stat { padding: 18px 20px; }
  .stat .k { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
  .stat .v { font-family: 'Playfair Display', serif; font-size: 30px; margin-top: 2px; letter-spacing: -.01em; }
  .stat .d { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
  .stat .d.up { color: var(--green); } .stat .d.warn { color: var(--red); }

  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .neg { color: var(--red-ink); }
  .muted { color: var(--ink-3); }
  .small { font-size: 13px; }

  table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
  .t th { text-align: left; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 0 12px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .t td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .t tr:last-child td { border-bottom: none; }
  .t .r { text-align: right; }
  .t tbody tr.click { cursor: pointer; transition: background .15s; }
  .t tbody tr.click:hover { background: var(--bg); }
  .t tfoot td { font-weight: 600; border-top: 2px solid var(--line-2); border-bottom: none; }
  .t .who { font-weight: 600; }
  .t .who small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
  .tablewrap { overflow-x: auto; margin: 0 -22px; padding: 0 22px; }

  .bar { height: 8px; border-radius: 999px; background: var(--bg-soft); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--blue); }
  .bar.ok i { background: var(--green); } .bar.mid i { background: var(--gold); } .bar.hot i { background: var(--red); }

  .todo { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .todo:last-child { border-bottom: none; }
  .todo .ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; font-size: 16px; }
  .todo .tx { flex: 1; font-size: 14px; } .todo .tx small { display: block; color: var(--ink-3); font-size: 12.5px; }

  .fund { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .fund:last-child { border-bottom: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .fund .nm { flex: 1; font-weight: 600; font-size: 14.5px; } .fund .nm small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12.5px; }

  .stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; margin: 6px 0 14px; }
  .stack i { display: block; height: 100%; }

  .note { background: var(--blue-soft); color: var(--blue-ink); border-radius: var(--radius-md); padding: 12px 16px; font-size: 13.5px; }
  .note.gold { background: var(--gold-soft); color: var(--gold-ink); }
  .note.green { background: var(--green-soft); color: var(--green-ink); }

  .receipt { width: 34px; height: 42px; border-radius: 5px; background: repeating-linear-gradient(#fff 0 5px, #eee8dc 5px 6px); border: 1px solid var(--line-2); display: inline-block; vertical-align: middle; }
  .receipt.none { background: var(--red-soft); border: 1px dashed var(--red); }

  .ccard { border-radius: 16px; padding: 18px 20px; color: #fff; background: linear-gradient(135deg, #2557b8, #183b82); min-height: 128px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-2); }
  button.ccard { font: inherit; text-align: left; border: none; cursor: pointer; transition: transform .15s var(--ease), box-shadow .2s; } button.ccard:hover { transform: translateY(-2px); box-shadow: var(--shadow-3); }
  .ccard.alt { background: linear-gradient(135deg, #3a3631, #1d1b17); }
  .ccard.gold { background: linear-gradient(135deg, #b5892a, #7a5a14); }
  .ccard .row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; opacity: .9; }
  .ccard .amt { font-family: 'Playfair Display', serif; font-size: 26px; }
  .ccard .bar { background: rgba(255,255,255,.25); margin-top: 8px; } .ccard .bar i { background: #fff; }

  .seg { display: inline-flex; background: var(--bg-soft); border-radius: 999px; padding: 4px; gap: 2px; margin-bottom: 16px; }
  .seg button { border: none; background: transparent; font-size: 13.5px; font-weight: 600; color: var(--ink-2); padding: 7px 15px; border-radius: 999px; cursor: pointer; }
  .seg button.active { background: #fff; color: var(--blue-ink); box-shadow: 0 1px 3px rgba(60,40,10,.14); }

  /* ---------- forms in the slide-in panel ---------- */
  .f { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .f > label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .f input, .f select, .f textarea { font-family: inherit; font-size: 15px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; width: 100%; }
  .f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(37,87,184,.12); }
  .f .help { font-size: 12.5px; color: var(--ink-3); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel h2 { font-size: 26px; margin-bottom: 4px; }
  .panel .lead { color: var(--ink-2); font-size: 14px; margin-bottom: 20px; }
  .panel .section { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; }
  .panel .section h3 { font-family: inherit; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .denoms { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; }
  .denoms label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
  .denoms input { width: 72px; text-align: right; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  .split { display: grid; grid-template-columns: 1fr 120px 28px; gap: 8px; margin-bottom: 8px; align-items: center; }
  .split select, .split input { font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 100%; }
  .split input { text-align: right; }
  .split button { border: none; background: none; color: var(--ink-3); font-size: 18px; cursor: pointer; }
  .balance { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; margin-top: 6px; }
  .balance.ok { background: var(--green-soft); color: var(--green-ink); }
  .balance.off { background: var(--red-soft); color: var(--red-ink); }
  .drop { border: 2px dashed var(--line-2); border-radius: var(--radius-md); padding: 26px; text-align: center; color: var(--ink-3); font-size: 14px; cursor: pointer; background: var(--bg); transition: border-color .2s; }
  .drop:hover, .drop.over { border-color: var(--blue); color: var(--blue-ink); }
  .drop b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 2px; }
  .panel-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 14px 18px; border-top: 1px solid var(--line); background: rgba(255,255,255,.7); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  details.acct { margin-top: 8px; font-size: 13px; }
  details.acct summary { cursor: pointer; color: var(--blue); font-weight: 600; }
  details.acct table { margin-top: 10px; }

  .switch { position: relative; width: 40px; height: 24px; flex-shrink: 0; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); transition: background .2s; }
  .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .2s var(--ease); }
  .switch input:checked + span { background: var(--green); }
  .switch input:checked + span::after { transform: translateX(16px); }
  .switch input:focus-visible + span { outline: 3px solid rgba(37,87,184,.35); outline-offset: 2px; }

  /* sentence-style rule builder */
  .sentence { font-size: 17px; line-height: 2.6; color: var(--ink); }
  .sentence select, .sentence input { font: inherit; font-size: 16px; font-weight: 600; color: var(--blue-ink); background: var(--blue-soft); border: none; border-radius: 9px; padding: 6px 10px; }
  .sentence input { width: 84px; text-align: right; }
  .sentence select:focus, .sentence input:focus { outline: 3px solid rgba(37,87,184,.3); }
  .example { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; font-size: 14px; }
  .example > :nth-child(even) { text-align: right; }

  a.btn { text-decoration: none; display: inline-block; }
  .btn { white-space: nowrap; } .card-head .btn { flex-shrink: 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-weight: 600; color: var(--blue-ink); word-break: break-all; }
  .mail { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
  .mail .nm { flex: 1; min-width: 0; font-size: 14px; } .mail .nm b { font-weight: 600; } .mail .nm small { display: block; color: var(--ink-3); font-size: 12.5px; }
  .mail .pdf { width: 34px; height: 40px; border-radius: 6px; background: var(--red-soft); color: var(--red-ink); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; flex-shrink: 0; }
  .bline { display: block; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: none; border-bottom: 1px solid var(--line); padding: 13px 0; cursor: pointer; }
  .bline:hover { background: linear-gradient(90deg, transparent, var(--bg), transparent); }
  .bl-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; } .bl-top .nm { flex: 1; min-width: 150px; font-size: 14.5px; } .bl-top .nm small { display: block; color: var(--ink-3); font-size: 12.5px; }
  .bline.child { padding-left: 26px; position: relative; } .bline.child::before { content: '↳'; position: absolute; left: 6px; top: 14px; color: var(--ink-3); }
  .bline.child .bl-top .nm b { font-weight: 500; }
  .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .45; border-radius: 2px; }
  .bar:has(.pace) { overflow: visible; }
  .fundfoot { display: flex; gap: 8px 22px; flex-wrap: wrap; justify-content: flex-end; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
  .yearbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 16px; }
  .grouph { font-size: 22px; margin: 26px 0 12px; display: flex; align-items: center; flex-wrap: wrap; }
  details.je { border-bottom: 1px solid var(--line); padding: 10px 0; }
  details.je summary { display: flex; gap: 12px; align-items: baseline; cursor: pointer; list-style: none; font-size: 14px; } details.je summary::-webkit-details-marker { display: none; }
  details.je summary .nm { flex: 1; min-width: 0; }
  .t .sech { font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding-top: 18px; }
  .t tr.tot td { font-weight: 600; border-top: 2px solid var(--line-2); }
  .spl .sphead, .spl .sprow { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) 96px 26px; gap: 8px; align-items: center; }
  .spl .sphead { font-size: 11.5px; color: var(--ink-3); margin-bottom: 4px; }
  .spl .sprow { margin-bottom: 8px; }
  .spl select, .spl input { font: inherit; font-size: 14px; padding: 8px 9px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 100%; min-width: 0; }
  .spl input { text-align: right; } .spl input[readonly] { background: var(--bg); color: var(--ink-2); }
  .spl [data-sprm] { border: none; background: none; color: var(--ink-3); font-size: 18px; cursor: pointer; }
  .spl .spbal { font-size: 13px; font-weight: 600; margin-top: 8px; border-radius: 8px; }
  .spl .spbal.ok { color: var(--green-ink); } .spl .spbal.off { color: var(--red-ink); }
  .spl.phone .sphead { display: none; } .spl.phone .sprow { grid-template-columns: 1fr 84px 24px; } .spl.phone .sprow [data-sp=acct] { display: none; }
  .badge-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--red); margin-left: 4px; vertical-align: middle; }
  /* spending pipeline */
  .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .step { display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow-1); transition: transform .15s var(--ease), border-color .2s; position: relative; }
  .step:hover { transform: translateY(-1px); }
  .step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
  .step .lbl { flex: 1; font-weight: 600; font-size: 14px; line-height: 1.3; } .step .lbl small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
  .step .c { text-align: right; font-family: 'Playfair Display', serif; font-size: 24px; line-height: 1; } .step .c small { display: block; font-family: 'Inter', sans-serif; font-size: 11.5px; color: var(--ink-3); margin-top: 4px; }
  .step.red .n { background: var(--red-soft); color: var(--red-ink); } .step.gold .n { background: var(--gold-soft); color: var(--gold-ink); }
  .step.blue .n { background: var(--blue-soft); color: var(--blue-ink); } .step.green .n { background: var(--green-soft); color: var(--green-ink); }
  .step.active { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,87,184,.15); }
  .av { width: 34px; height: 34px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-ink); display: grid; place-items: center; font-size: 12.5px; font-weight: 700; flex-shrink: 0; }
  .owe { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .owe-h { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; } .owe-h .nm { flex: 1; font-size: 14px; } .owe-h .nm small { display: block; color: var(--ink-3); font-size: 12.5px; }
  .owe-i { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 5px 0 5px 46px; font-size: 13.5px; } .owe-i > span:first-child { flex: 1; min-width: 140px; }
  .chk { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; } .chk > span:nth-child(2) { flex: 1; }
  .chk .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line-2); display: grid; place-items: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .chk.done .box { background: var(--green); border-color: var(--green); color: #fff; } .chk.done > span:nth-child(2) { color: var(--ink-3); }

  /* staff phone view */
  .snapwrap { display: grid; grid-template-columns: 380px 1fr; gap: 36px; align-items: start; }
  .phone { width: 100%; max-width: 380px; margin: 0 auto; background: var(--bg); border: 10px solid #1d1b17; border-radius: 44px; min-height: 680px; overflow: hidden; box-shadow: var(--shadow-3); }
  .ph-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 22px; font-size: 12.5px; background: #fff; border-bottom: 1px solid var(--line); } .ph-top b { color: var(--blue); font-family: 'Playfair Display', serif; font-weight: 500; font-size: 16px; }
  .ph-body { padding: 20px 18px; }
  .ph-hi { font-family: 'Playfair Display', serif; font-size: 25px; }
  .ph-item { display: flex; justify-content: space-between; gap: 10px; width: 100%; text-align: left; font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--red); border-radius: 14px; padding: 13px 14px; margin-bottom: 10px; cursor: pointer; font-size: 14.5px; }
  .ph-item small { display: block; color: var(--ink-3); font-size: 12.5px; font-weight: 400; } .ph-item .num { text-align: right; } .ph-item small.late { color: var(--red); }
  .ph-btn { display: block; width: 100%; font: inherit; font-size: 15.5px; font-weight: 600; border: none; border-radius: 14px; padding: 15px; margin-top: 12px; background: var(--blue); color: #fff; cursor: pointer; }
  .ph-btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line-2); } .ph-btn:disabled { opacity: .4; cursor: not-allowed; }
  .ph-cam { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; font: inherit; border: 2px dashed var(--line-2); background: #fff; border-radius: 16px; padding: 28px 14px; margin: 14px 0 6px; cursor: pointer; color: var(--ink); font-size: 15px; } .ph-cam small { color: var(--ink-3); font-size: 12.5px; }

<!-- The church. Sample mode: two files in churches/<id>/, picked with ?church=<id> (default rcc).
     Cloud mode (?cloud): sign in, and the church's books load from Firebase (cloud.js, cloud-config.js). -->

    window.CLOUD_MODE = q.has('cloud');
    if (window.CLOUD_MODE) {

      document.write(['app', 'auth', 'firestore', 'functions', 'storage'].map(m => '<script src="' + b + m + '-compat.js"><\/script>').join('') + '<script src="cloud-config.js"><\/script><script src="cloud.js"><\/script>');

  })();

<!-- The app. It starts at the bottom of the page: right away with sample data, or after sign-in in cloud mode. -->
<script type="text/plain" id="appjs">
/* ======================================================================
   The church. Nothing in this app is about one church: who it is, its funds, how
   giving is split, its banks, cards, people, budgets and policies all come from
   churches/<id>/setup.js, and its activity from churches/<id>/sample.js.
   ====================================================================== */
const SETUP = CHURCH_SETUP, SAMPLE = CHURCH_SAMPLE, POL = SETUP.policies;
const OP = SETUP.operatingFund;                 // the day-to-day (unrestricted) fund
const copy = o => JSON.parse(JSON.stringify(o)); // the app edits its own copy; the setup file stays as written
// Cloud version: what was saved last time (sample mode: the starting value)
const saved = (k, d) => window.CLOUD && CLOUD.app && CLOUD.app[k] != null ? CLOUD.app[k] : d;
// What members can give to. ytd is filled in from the books.
const GIVING = SETUP.giving.map(g => ({ ...copy(g), ytd: 0 }));
// Where money is set aside. bal / ytdIn / ytdOut are filled in from the books.
// Restricted = givers gave it for a purpose. Board-designated = unrestricted, but the board set it aside (and can release it).
const kindOf = f => f.restriction === 'with' ? 'Restricted' : f.designated ? 'Board-designated' : 'Unrestricted';
const kindPill = f => `<span class="pill ${f.restriction === 'with' ? 'gold' : f.designated ? 'blue' : 'gray'}">${kindOf(f)}</span>`;
const FUNDS = SETUP.funds.map(f => ({ ...copy(f), kind: kindOf(f), bal: 0, ytdIn: 0, ytdOut: 0 }));
// How each giving fund is split. Percentages always add up to 100.
const ALLOC = Object.fromEntries(SETUP.giving.map(g => [g.id, { since: g.since || '', why: g.why || '', lines: copy(g.split) }]));
const isSplit = g => ALLOC[g].lines.length > 1;   // giving that's shared across funds by percentage (e.g. Kingdom Builders)
// Which giving funds feed a fund, e.g. "Tithes" or "Kingdom Builders · 50%"
const feeds = fid => GIVING.map(g => { const l = ALLOC[g.id].lines.find(x => x.to === fid); return l ? { g, pct: l.pct } : null; }).filter(Boolean);
const feedText = fid => feeds(fid).map(({ g, pct }) => isSplit(g.id) ? `${g.name} · ${pct}% of every gift` : `From ${g.name}`).join(' + ') || 'No giving goes here directly';
// Giving each fund can expect this year: a giving fund's yearly goal if it has one, otherwise this year's pace
// For a campaign, what's committed plus the pace of everyone else; otherwise the goal, otherwise this year's pace
const givingExpected = g => { if (g.campaign) { const s = campaignOf(g); return (s.planTotal + s.otherGiven / YEAR_DONE) / 100; } return g.annualGoal || g.ytd / YEAR_DONE; };
const expectedFor = fid => feeds(fid).reduce((s, { g, pct }) => s + givingExpected(g) * pct / 100, 0);
const SPLIT_G = () => (GIVING.find(g => isSplit(g.id)) || {}).id;   // the giving fund new restricted funds join (none if nothing is split)
const restrictedLabel = () => (GIVING.find(g => isSplit(g.id)) || { name: 'Restricted' }).name;
// book = what the ledger says; bank = the bank's own statement
const BANKS = SETUP.banks.map(b => ({ ...copy(b), last4: b.last4 || '—', book: 0, bank: b.kind === 'cash' ? null : 0 }));
const bankLabel = code => { const b = SETUP.banks.find(x => x.code === code); return b ? `${b.name}${b.last4 ? ' ••' + b.last4 : ''}` : code; };
const PAYOUTS = copy(SAMPLE.payouts), CASH = copy(SAMPLE.cash);
// People who spend church money or review it. Each card belongs to one person.
const PEOPLE = Object.fromEntries(Object.entries(copy(SETUP.people)).map(([id, p]) => [id, { ...p, card: null }]));
SETUP.cards.forEach(c => { if (PEOPLE[c.holder]) PEOPLE[c.holder].card = `${c.name} ••${c.last4}`; });
const ME = PEOPLE[SETUP.currentUser].name;
// People who spend money and send receipts (a "group" like a finance team can lead budgets but doesn't carry a card)
const owes = id => EXPENSES.filter(e => e.who === id && !e.receipt).length;
const SENDERS = () => Object.keys(PEOPLE).filter(id => !PEOPLE[id].group && (PEOPLE[id].card || EXPENSES.some(e => e.who === id))).sort((a, b) => owes(b) - owes(a));
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
// Many people send receipts in; only these one or two people review them.
const REVIEWERS = POL.reviewers.slice(); // add more from Spending → Reviewers → Change
// Budgets: every fund can hold budgets for ministries, projects and events.
// Staff pick one when they send a receipt ("What was it for?"), which fills in the fund
// and counts the spending against that budget. What's been spent comes from the ledger.
const PROJECTS = copy(SETUP.budgets);
// A budget can sit inside another one (a project inside a ministry).
// The parent's budget includes its projects; their spending rolls up into it.
const kids = p => PROJECTS.filter(x => x.parent === p.name);
const projLabel = p => (p.parent ? p.parent + ' › ' : '') + p.name;
const projOptions = sel => FUNDS.map(f => { const top = PROJECTS.filter(p => p.fund === f.id && !p.parent); return top.length ? `<optgroup label="${esc(f.name)}">${top.map(p => [p, ...kids(p)]).flat().map(p => `<option value="${esc(p.name)}" ${p.name === sel ? 'selected' : ''}>${p.parent ? '\u00a0\u00a0\u00a0↳ ' : ''}${esc(p.name)}</option>`).join('')}</optgroup>` : ''; }).join('');
const TODAY = SAMPLE.today, YEAR = TODAY.slice(0, 4);

function netAssetsCard() {
  const n = BooksReports.netAssets(BOOKS), bar = [[n.undesignated, '#8a8f98'], [n.designatedTotal, '#4a6b8a'], [n.withTotal, '#b5892a']];
  const row = (name, amt, small, strong) => `<div class="fund" style="padding:7px 0"><div class="nm" style="${strong ? '' : 'font-weight:500'}">${name}${small ? `<small>${small}</small>` : ''}</div><div class="num">${strong ? `<b>${fc(amt)}</b>` : fc(amt)}</div></div>`;
  const dfunds = FUNDS.filter(f => f.designated);
  return `<div class="grid g2 mb" style="align-items:start">
    <div class="card"><h2>Who decides how it's used</h2><div class="sub">Net assets, the way the auditor reads them</div>
      <div class="stack">${bar.filter(([a]) => a > 0).map(([a, c]) => `<i style="width:${a / Math.max(1, n.total) * 100}%;background:${c}"></i>`).join('')}</div>
      ${row('Without donor restrictions', n.withoutTotal, 'The church decides', true)}
      ${row('&nbsp;&nbsp;&nbsp;Free to use', n.undesignated, n.undesignatedFunds.map(f => esc(f.name)).join(', '))}
      ${n.designated.map(f => row(`&nbsp;&nbsp;&nbsp;Set aside by the board · ${esc(f.name)}`, f.amount, esc((fund(f.fund).about || '') + (fund(f.fund).approvedOn ? ` · since ${fund(f.fund).approvedOn}` : '')))).join('')}
      ${row('With donor restrictions', n.withTotal, 'Givers decided — only for its purpose', true)}
      ${row('Total', n.total, '', true)}</div>
    <div class="card"><h2>Board-designated money</h2><div class="sub">Unrestricted money the board has set aside</div>
      <p class="small" style="line-height:1.55;margin-bottom:12px">Givers didn't restrict it, so it's still the church's to use. The board set it aside for a purpose${dfunds.length ? ` (${andList(dfunds.map(f => esc(f.name)))})` : ', like a reserve'}. Only the board can set more aside or release it, and each move is recorded with its approval. On the reports it counts as <b>without donor restrictions</b>.</p>
      ${dfunds.length ? '' : '<p class="muted small" style="margin-bottom:12px">None yet. Add one in Settings → Funds &amp; giving → Add a fund.</p>'}
      <button class="btn small soft" data-open="transfer">Set money aside or release it</button></div></div>`;
}

const STAGES = [
  { s: 'Needs receipt', n: 1, tone: 'red',   help: 'Anyone who spent sends a photo' },
  { s: 'Needs review',  n: 2, tone: 'gold',  help: 'A reviewer checks it' },
  { s: 'Done',          n: 3, tone: 'green', help: 'Approved and in the books' },
];
const reviewerNames = () => REVIEWERS.map(id => PEOPLE[id].name.split(' ')[0]).join(' and ') || 'nobody yet';
const initials = n => n.split(' ').map(w => w[0]).join('').slice(0, 2);
const avatar = id => `<span class="av">${initials(PEOPLE[id].name)}</span>`;

function regCard() {
  if (!REG.events.length) return '';
  const unlinked = REG.events.filter(e => !e.proj);
  const evName = id => regEvent(id).name;
  return `<div class="card mb"><div class="card-head"><div><h2>Event sign-ups</h2><div class="muted small" style="margin-top:2px">From ${esc(REG_SRC)} · each event is recorded straight to its budget</div></div><span class="pill green">● Connected</span></div>
    ${unlinked.map(e => `<div class="note gold mb" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1"><b>${esc(e.name)}</b> isn't linked to a budget yet, so its sign-up money can't be recorded.</span>
      <select class="select" data-reglink="${e.id}"><option value="">Link to a budget…</option>${projOptions('')}<option value="__new">+ Make a new event budget</option></select></div>`).join('')}
    <div class="tablewrap"><table class="t"><thead><tr><th>Arrived</th><th>Events</th><th class="r">Sign-ups</th><th class="r">${esc(FEE_SRC)} fee</th><th class="r">To bank</th><th></th></tr></thead>
    <tbody>${REG.payouts.map(p => { const gross = sum(p.lines.map(l => l.amount)); return `<tr><td><b>${p.date}</b></td>
      <td>${p.lines.map(l => `<div class="small">${esc(evName(l.event))} · ${l.count} × ${fmt(regEvent(l.event).price, 0)} <span class="muted">→ ${regEvent(l.event).proj ? esc(regEvent(l.event).proj) : '<span style="color:var(--red)">not linked</span>'}</span></div>`).join('')}</td>
      <td class="r num">${fmt(gross)}</td><td class="r num muted">${fmt(-(p.fee || 0))}</td><td class="r num"><b>${fmt(gross - (p.fee || 0))}</b></td>
      <td class="r">${p.status === 'New' ? `<button class="btn small primary" data-regrec="${p.id}">Record</button>` : '<span class="pill green">Recorded</span>'}</td></tr>`; }).join('')}
      ${REG.refunds.map(r => `<tr><td><b>${r.date}</b></td><td><div class="small">Refund · ${esc(evName(r.event))}${r.note ? ' · ' + esc(r.note) : ''}</div></td><td class="r num neg">${fmt(-r.amount)}</td><td></td><td class="r num neg">${fmt(-r.amount)}</td><td class="r"><span class="pill ${r.status === 'Recorded' ? 'green' : 'gold'}">${r.status}</span></td></tr>`).join('')}</tbody></table></div>
    <div class="muted small" style="margin-top:10px">${REG.events.filter(e => e.proj).map(e => `${esc(e.name)}: ${e.signups} signed up → ${esc(e.proj)}`).join(' · ')}</div></div>`;
}
function requestsCard() {
  const waiting = REQUESTS.filter(r => r.status === 'Waiting'), approved = REQUESTS.filter(r => r.status === 'Approved');
  if (!waiting.length && !approved.length) return '';
  const row = r => { const st = apStatus(r, r.who), p = project(r.proj); return `<div class="owe"><div class="owe-h">${avatar(r.who)}<div class="nm"><b>${esc(r.what)}</b><small>${esc(PEOPLE[r.who].name)} · ${esc(r.proj)} · asked ${r.asked}${r.needBy ? ' · needed by ' + esc(r.needBy) : ''}</small></div>
      <span class="num"><b>${fmt(r.amt)}</b></span>${r.status === 'Waiting' ? `<button class="btn small primary" data-req="${r.id}">Review</button>` : `<span class="pill green">Approved</span>`}</div>
      <div class="owe-i"><span class="muted small">${r.status === 'Waiting' ? `${st.have} of ${st.need} approvals · ` : `Approved ${r.approvedOn} · held until it's bought or ${POL.requestGoodForDays ? 'expires in ' + Math.max(0, POL.requestGoodForDays - requestAge(r)) + ' days' : 'cancelled'} · `}${esc(p.name)} has ${fmt(leftIn(p), 0)} left after holds</span></div></div>`; };
  return `<div class="card mb"><div class="card-head"><div><h2>Spending requests</h2><div class="muted small" style="margin-top:2px">Asked before buying${POL.askFirstOver ? ` — required over ${fmt(POL.askFirstOver, 0)}` : ''}</div></div><span class="muted small">${waiting.length} waiting · ${approved.length} approved, not bought yet</span></div>
    ${waiting.map(row).join('')}${approved.map(row).join('')}</div>`;
}
function paybackCard() {
  const who = [...new Set(EXPENSES.filter(e => e.reimb === 'To pay').map(e => e.who))];
  if (!who.length) return '';
  const ach = who.filter(payBackHow).filter(pid => payBackHow(pid) !== 'Check');
  return `<div class="card mb"><div class="card-head"><div><h2>Pay people back</h2><div class="muted small" style="margin-top:2px">Approved receipts for things people bought with their own money</div></div>
      ${ach.length > 1 ? `<button class="btn small primary" data-paybackall>Pay all ${ach.length} by ACH · ${fmt(sum(ach.map(pid => sum(owedTo(pid).map(e => e.amt)))))}</button>` : ''}</div>
    ${who.map(pid => { const items = owedTo(pid), how = payBackHow(pid); return `<div class="owe"><div class="owe-h">${avatar(pid)}<div class="nm"><b>${esc(PEOPLE[pid].name)}</b><small>${how ? 'Paid by ' + how.replace(/^Check$/, 'check') : 'No bank details yet — check, or ask for them'}</small></div>
      <span class="num"><b>${fmt(sum(items.map(e => e.amt)))}</b></span><button class="btn small soft" data-payback="${pid}">Pay</button></div>
      ${items.map(e => `<div class="owe-i"><span>${esc(e.payee)} <b class="num">${fmt(e.amt)}</b></span><span class="pill blue">${esc(partsLabel(e))}</span><span class="muted small">${e.date}</span></div>`).join('')}</div>`; }).join('')}
  </div>`;
}
function inboxCard() {
  const show = INBOX.filter(m => m.state !== 'ignored');
  const icon = { matched: ['green', '✓ Matched'], suggest: ['gold', 'Needs a click'], waiting: ['gray', 'Waiting for charge'], ignored: ['gray', 'Ignored'], bill: ['blue', 'Invoice'] };
  return `<div class="card mb"><div class="card-head"><div><h2>Receipts inbox</h2><div class="muted small" style="margin-top:2px">Email or forward any receipt to <b class="mono">${INBOX_ADDR}</b></div></div><button class="btn small soft" data-open="inbox">Set up</button></div>
    ${show.map(m => { const i = INBOX.indexOf(m), [tone, lbl] = icon[m.state]; const e = m.state === 'suggest' ? EXPENSES.find(x => x.payee === m.payee && !x.receipt) : null; return `<div class="mail">
      <span class="pdf">${m.file && m.file !== 'email' ? 'PDF' : '✉'}</span>
      <div class="nm"><b>${esc(m.subj)}</b><small>${m.date} · ${m.addr === 'forwarded' ? 'forwarded by ' + m.from : m.from}${m.amt ? ' · ' + fmt(m.amt) : ''}</small>
        ${m.state === 'suggest' && e ? `<small style="color:var(--ink-2)">Looks like ${PEOPLE[e.who].name.split(' ')[0]}'s ${e.payee} charge on ${e.date} (${fmt(e.amt)}, ${e.proj})</small>` : m.note ? `<small>${m.note}</small>` : ''}</div>
      ${m.state === 'suggest' && e ? `<button class="btn small good" data-attach="${i}">Attach</button>` : m.state === 'bill' ? `<button class="btn small soft" data-inboxbill="${i}">Add as bill</button>` : `<span class="pill ${tone}">${lbl}</span>`}</div>`; }).join('')}
    <div class="muted small" style="margin-top:10px">${INBOX.filter(m => m.state === 'ignored').length} newsletter${INBOX.filter(m => m.state === 'ignored').length === 1 ? '' : 's'} ignored</div></div>`;
}

let expFilter = 'All';
V.expenses = () => {
  const list = EXPENSES.filter(e => expFilter === 'All' || e.status === expFilter);
  const inStage = s => EXPENSES.filter(e => e.status === s);
  const owed = EXPENSES.filter(e => !e.receipt);
  const byPerson = {};
  owed.forEach(e => (byPerson[e.who] = byPerson[e.who] || []).push(e));
  const people = Object.entries(byPerson).sort((a, b) => Math.max(...b[1].map(e => e.days)) - Math.max(...a[1].map(e => e.days)));
  return `
  <div class="vhead"><div><h1>Spending</h1><p>Everyone who spends church money sends a photo of the receipt. Only ${REVIEWERS.length === 1 ? reviewerNames() + ' reviews and approves' : reviewerNames() + ' review and approve'}. Three steps, and the month is ready to close.</p></div>
    <div class="acts"><a class="btn" href="#snap">📱 What senders see</a>${inStage('Needs review').length ? `<button class="btn primary" data-review="next">Review ${inStage('Needs review').length} receipts</button>` : ''}</div></div>

  <div class="steps mb">${STAGES.map(st => { const items = inStage(st.s); return `
    <button class="step ${expFilter === st.s ? 'active' : ''} ${st.tone}" data-expf="${expFilter === st.s ? 'All' : st.s}">
      <span class="n">${st.n}</span><span class="lbl">${st.s}<small>${st.help}</small></span>
      <span class="c">${items.length}<small>${fmt(sum(items.map(e => e.amt)), 0)}</small></span></button>`; }).join('')}</div>

  ${inboxCard()}
  ${requestsCard()}
  ${paybackCard()}

  <div class="grid g2 mb">
    <div class="card"><div class="card-head"><h2>Who owes receipts</h2><span class="muted small">${owed.length} receipts · ${people.length} people</span></div>
      ${people.map(([id, items]) => `<div class="owe">
        <div class="owe-h">${avatar(id)}<div class="nm"><b>${PEOPLE[id].name}</b><small>${PEOPLE[id].role}${PEOPLE[id].card ? ' · ' + PEOPLE[id].card : ''}</small></div><button class="btn small soft" data-remind="${id}">Remind</button></div>
        ${items.map(e => `<div class="owe-i"><span>${e.payee} <b class="num">${fmt(e.amt)}</b></span><span class="pill blue">${e.proj}</span><span class="pill ${e.days >= 7 ? 'red' : 'gray'}">${e.days} day${e.days === 1 ? '' : 's'}</span></div>`).join('')}
      </div>`).join('') || '<div class="empty"><b>All caught up</b>Every charge has its receipt.</div>'}
      <div class="note" style="margin-top:12px">Automatic reminders: a text the day the charge comes in, again on day 3, then day 7 with ${reviewerNames()} copied.</div>
    </div>
    <div>
      <div class="card mb"><div class="card-head"><h2>Reviewers</h2><button class="linkbtn" data-open="reviewers">Change</button></div>
        <div class="sub">They check every receipt first. Anyone can send one. Bigger amounts also follow the approval rules below.</div>
        ${REVIEWERS.map(id => `<div class="owe-h" style="padding:6px 0">${avatar(id)}<div class="nm"><b>${PEOPLE[id].name}</b><small>${PEOPLE[id].role}</small></div></div>`).join('')}
        <div class="muted small" style="margin-top:8px">${REVIEWERS.length > 1 ? 'Any reviewer can approve. Nobody approves their own spending: those go to another reviewer.' : 'Add a second reviewer later so your own spending is checked by someone else.'}</div></div>
      <div class="card mb"><div class="card-head"><h2>Approval rules</h2><button class="linkbtn" data-open="tiers">Change</button></div>
        <div class="sub">How many people have to say yes, by amount. Approvers: ${andList(POL.approvers.map(id => esc(PEOPLE[id].name)))}.</div>
        ${(POL.approvalTiers || [{ upTo: null, approvals: 1 }]).map((t, i, all) => `<div class="fund" style="padding:8px 0"><div class="nm" style="font-weight:500">${tierLabel(t, i, all)}</div><span class="pill ${t.approvals > 1 || t.board ? 'gold' : 'gray'}">${t.approvals} approval${t.approvals > 1 ? 's' : ''}${t.board ? ' + board vote' : ''}</span></div>`).join('')}
        ${POL.restrictedMinApprovals > 1 ? `<div class="muted small" style="margin-top:6px">Money given for a purpose always gets at least ${POL.restrictedMinApprovals}.</div>` : ''}</div>
      <div class="card"><h2>${MONTH} close</h2><div class="sub">Check these off before the books are locked for the month</div>${closeChecklist()}</div>
    </div>
  </div>

  <div class="card"><div class="card-head"><h2>${expFilter === 'All' ? 'Everything this month' : expFilter}</h2>${expFilter !== 'All' ? '<button class="linkbtn" data-expf="All">Show all</button>' : ''}</div>
    <div class="tablewrap"><table class="t">
    <thead><tr><th></th><th>Payee</th><th>Who</th><th>Project</th><th class="r">Amount</th><th class="r">Next step</th></tr></thead>
    <tbody>${list.map(e => { const i = EXPENSES.indexOf(e); return `<tr>
      <td><span class="receipt ${e.receipt ? '' : 'none'}" title="${e.receipt ? 'Receipt attached' : 'No receipt yet'}"></span></td>
      <td class="who">${e.payee}<small>${e.date} · ${e.acct} · ${e.paid}</small></td>
      <td class="small">${PEOPLE[e.who].name}</td>
      <td>${parts(e).length > 1 ? parts(e).map(p => `<div style="margin-bottom:3px"><span class="pill blue">${esc(p.proj)}</span> <span class="small num">${fmt(p.amt)}</span></div>`).join('') + '<div class="muted small">Split receipt</div>' : `<span class="pill blue">${esc(e.proj)}</span><div class="muted small" style="margin-top:3px">${project(e.proj).parent ? esc(project(e.proj).parent) + ' · ' : ''}${fund(e.fund).name}</div>`}</td>
      <td class="r num"><b>${fmt(e.amt)}</b></td>
      <td class="r">${nextStep(e, i)}</td></tr>`; }).join('') || `<tr><td colspan="6" class="empty"><b>All clear</b>Nothing at this step.</td></tr>`}</tbody>
  </table></div></div>`;
};
function nextStep(e, i) {
  if (e.status === 'Needs receipt') return `<button class="btn small" data-remind="${e.who}">Remind</button>`;
  if (e.status === 'Needs review') return `<button class="btn small primary" data-review="${i}">Review</button>${(() => { const st = apStatus(e, e.who); return st.need > 1 || planOf(e).board ? `<div class="small muted" style="margin-top:3px">${st.have} of ${st.need} approvals${planOf(e).board ? ' + board' : ''}</div>` : ''; })()}${lookClosely(e) ? `<div class="small" style="margin-top:3px;color:var(--gold-ink)">⚑ ${lookClosely(e)}</div>` : ''}`;
  if (e.reimb === 'Check queued') return `<button class="btn small" data-go="checks">In the check queue</button>`;
  if (e.reimb === 'To pay') return `<button class="btn small primary" data-payback="${e.who}">Pay back</button><div class="muted small" style="margin-top:3px">Approved · owed to ${esc(PEOPLE[e.who].name.split(' ')[0])}</div>`;
  if (e.reimb === 'Paid') return `<span class="pill green">Paid back</span><div class="muted small" style="margin-top:3px">${e.reimbPaidOn} · ${esc(e.reimbMethod)}</div>`;
  return `<span class="pill green">Done</span>${e.by ? `<div class="muted small" style="margin-top:3px">OK'd by ${e.by}</div>` : ''}`;
}
function closeChecklist() {
  const items = [
    ['Every card charge has a receipt', EXPENSES.filter(e => !e.receipt).length, 'missing'],
    ['Every receipt is reviewed', EXPENSES.filter(e => e.status === 'Needs review').length, 'waiting'],
    ['All counted money is deposited', CASH.filter(c => c.status === 'Counted').length, 'waiting'],
    ['Everyone is paid back', new Set(EXPENSES.filter(e => e.reimb && e.reimb !== 'Paid').map(e => e.who)).size, 'waiting'],
    ['Scheduled payments made', manualDue().length, 'due'],
    ['No bills are late', BILLS.filter(b => b.status !== 'Paid' && b.status !== 'To approve' && daysTo(b.due) < 0).length, 'late'],
    [`${GIV_SRC} payouts recorded`, PAYOUTS.filter(p => p.status === 'New').length, 'new'],
    ['Bank lines all matched', BANKLINES.filter(l => !l.ok).length, 'unmatched'],
    ['Bank reconciled and reviewed through the latest statement', SETUP.banks.filter(b => b.kind !== 'cash' && !RECONS.some(r => r.account === b.code && r.through >= iso(SAMPLE.statementThrough || short(D)) && r.reviewedBy)).length, 'to do'],
    ['Card statements match', 0, ''],
  ];
  const done = items.filter(x => !x[1]).length;
  return `<div class="bar ${done === items.length ? 'ok' : 'mid'}" style="margin-bottom:10px"><i style="width:${done / items.length * 100}%"></i></div>` +
    items.map(([t, n, w]) => `<div class="chk ${n ? '' : 'done'}"><span class="box">${n ? '' : '✓'}</span><span>${t}</span>${n ? `<span class="pill red">${n} ${w}</span>` : ''}</div>`).join('') +
    `<button class="btn ${done === items.length ? 'primary' : ''}" style="margin-top:14px;width:100%" ${done === items.length ? '' : 'disabled'} data-open="lockmonth">${done === items.length ? `Lock ${MONTH}` : `${items.length - done} left before you can lock ${MONTH}`}</button>`;
}

/* ---------- staff view: what someone sees on their phone ---------- */
let snap = { who: null, step: 'list', i: null };   // who = the sender being previewed (first sender by default)
V.snap = () => {
  if (!snap.who) snap.who = SENDERS()[0];
  const me = PEOPLE[snap.who], mine = EXPENSES.filter(e => e.who === snap.who && !e.receipt);
  const e = EXPENSES[snap.i];
  let body;
  if (snap.step === 'list') body = `
    <div class="ph-hi">Hi ${me.name.split(' ')[0]} 👋</div>
    <p class="muted small" style="margin-bottom:14px">${mine.length ? `You have <b>${mine.length}</b> receipt${mine.length > 1 ? 's' : ''} to send.` : 'You\'re all caught up. Thank you!'}</p>
    ${owedTo(snap.who).length ? `<div class="note green" style="margin-bottom:12px">💵 ${fmt(sum(owedTo(snap.who).map(x => x.amt)))} approved — you'll be paid back ${payBackHow(snap.who) ? 'by ' + payBackHow(snap.who).replace(/^Check$/, 'check') : 'by check'} soon</div>` : ''}
    ${mine.map(x => `<button class="ph-item" data-snapi="${EXPENSES.indexOf(x)}"><span><b>${x.payee}</b><small>${x.date} · ${x.proj}</small></span><span class="num"><b>${fmt(x.amt)}</b><small class="${x.days >= 7 ? 'late' : ''}">${x.days} days ago</small></span></button>`).join('')}
    <button class="ph-btn ghost" data-snapi="new">📷 Snap a different receipt</button>
    <button class="ph-btn ghost" data-snapi="reimb">💵 I paid with my own money</button>
    <button class="ph-btn ghost" data-snapi="ask">🙋 Ask before buying</button>
    ${REQUESTS.filter(r => r.who === snap.who && r.status !== 'Used').map(r => `<div class="ph-req"><span><b>${esc(r.what)}</b><small>${fmt(r.amt)} · ${esc(r.proj)}</small></span><span class="pill ${({ Waiting: 'gold', Approved: 'green', Declined: 'red', Expired: 'gray' })[r.status]}">${r.status === 'Approved' ? 'Approved — go ahead' : r.status}</span></div>${r.declinedWhy ? `<div class="muted small" style="margin:-4px 0 8px 4px">“${esc(r.declinedWhy)}”</div>` : ''}`).join('')}`;
  else if (snap.step === 'photo') body = `
    <button class="linkbtn" data-snapback>← Back</button>
    <div class="ph-hi" style="margin-top:8px">${e.payee} · ${fmt(e.amt)}</div>
    <p class="muted small">${e.date} on ${e.paid}</p>
    <button class="ph-cam ${snap.shot ? 'got' : ''}" data-snapshot>${snap.shot ? `<b>✓ Photo added</b><small>Total $${e.amt.toFixed(2)} · ${e.date} — matches the charge</small>` : '<span style="font-size:34px">📷</span><b>Take a photo of the receipt</b><small>or choose one from your photos</small>'}</button>
    <label class="ph-lbl">What was it for?</label>
    ${splitEditor(e, 'phone')}
    <label class="ph-lbl">Note (optional)</label>
    <input class="ph-in" placeholder="e.g. Decorations for the kids' area">
    <button class="ph-btn" data-snapsend ${snap.shot ? '' : 'disabled'}>Send receipt</button>`;
  else if (snap.step === 'ask') { const proj = snap.askProj || (EXPENSES.find(x => x.who === snap.who) || {}).proj || PROJECTS[0].name, p = project(proj);
    body = `<button class="linkbtn" data-snapback>← Back</button>
    <div class="ph-hi" style="margin-top:8px">Ask before buying</div>
    <p class="muted small">${POL.askFirstOver ? `Anything over ${fmt(POL.askFirstOver, 0)} needs a yes first. ` : ''}You'll get a text when it's approved.</p>
    <label class="ph-lbl">What do you want to buy?</label><input class="ph-in" id="akWhat" placeholder="e.g. Snacks for small groups">
    <label class="ph-lbl">About how much?</label><input class="ph-in" id="akAmt" type="number" step=".01">
    <label class="ph-lbl">Which budget?</label><select class="ph-in" id="akProj">${projOptions(proj)}</select>
    <div class="note" style="margin-top:8px" id="akLeft">${esc(p.name)} has <b>${fmt(leftIn(p), 0)}</b> left</div>

function finishCheck(c, no) {
  c.no = no; c.date = short(D);
  let je;
  if (c.bill) { const b = BILLS.find(x => x.id === c.bill); je = payBill(b, { method: 'Check', checkNo: no }); Object.assign(b, { status: 'Paid', paidOn: short(D), method: `Check #${no}` }); }
  else if (c.reimb) { const items = EXPENSES.filter(e => e.checkId === c.id); items.forEach(e => { e.reimb = 'To pay'; }); je = payBack(c.reimb, { method: 'Check', checkNo: no }, items); }
  else je = BOOKS.post(R.bankPayment({ date: TODAY, party: c.payee, memo: `Check #${no} · ${c.payee}${c.memo ? ' · ' + c.memo : ''}`, source: { type: 'check', id: String(no) },
    amount: cents(c.amt), expense: EXPENSE_ACCT[c.category] || '5100', fund: c.fund || OP, project: c.proj, bank: CK.bank }), ME);
  c.je = je.id; c.status = 'Outstanding';
}
// Void: a printed check's payment is reversed and whatever it paid is open again (so it can be reissued);
// a check still in the queue is just cancelled. Cleared checks can't be voided — the bank already paid them.
function voidCheck(c, reason, reissue) {
  if (c.status === 'Cleared') throw new Error('The bank already paid this check');
  const bill = c.bill && BILLS.find(x => x.id === c.bill), items = c.reimb ? EXPENSES.filter(e => e.checkId === c.id) : [];
  if (c.status === 'Outstanding') {
    BOOKS.reverse(c.je, { reason: `Check #${c.no} void: ${reason}`, date: TODAY, by: ME });
    Object.assign(c, { status: 'Void', voidReason: reason });
  } else { CHECKS.splice(CHECKS.indexOf(c), 1); }
  if (bill) Object.assign(bill, { status: 'Approved', paidOn: null, checkId: null });
  items.forEach(e => Object.assign(e, { reimb: 'To pay', checkId: null, reimbPaidOn: null, reimbMethod: null }));
  if (reissue) {

    if (bill) Object.assign(bill, { status: 'Check queued', checkId: n.id });

function ten99() {
  const TH = POL.form1099Threshold || 600, from = `${YEAR}-01-01`, to = `${YEAR}-12-31`;
  const banks = BOOKS.accounts.filter(a => a.sub === 'bank' || a.sub === 'cash').map(a => a.code);
  const cards = BOOKS.accounts.filter(a => a.sub === 'card').map(a => a.code);

  const byCard = new Map(BooksReports.paidByParty(BOOKS, { accounts: cards, from, to }).map(r => [r.party, r.amount / 100]));
  const pending = v => sum(BILLS.filter(b => b.vendor === v.id && b.status !== 'Paid').map(b => b.amt));
  const rows = VENDORS.filter(needs1099).map(v => {
    const p = paid.get(v.name) || 0, later = pending(v), card = byCard.get(v.name) || 0;
    const status = p >= TH ? (w9ok(v) ? ['green', 'Needs a 1099 · ready'] : ['red', 'Needs a 1099 · no W-9'])
      : p + later >= TH ? ['gold', 'Will need one once open bills are paid'] : p >= TH * .75 ? ['gold', 'Getting close'] : ['gray', `Under ${fmt(TH, 0)}`];
    return { v, paid: p, later, card, status, file: p >= TH };
  }).sort((a, b) => b.paid - a.paid);
  const known = new Set([...VENDORS.map(v => v.name), ...Object.values(PEOPLE).map(p => p.name)]);
  const unknown = [...paid].filter(([n, a]) => !known.has(n) && a > 0).map(([name, amt]) => ({ name, amt })).sort((a, b) => b.amt - a.amt);
  const exempt = VENDORS.filter(v => !needs1099(v) && (paid.get(v.name) || 0) > 0);

}

function words(n) {
  const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const h = x => (x >= 100 ? ones[Math.floor(x / 100)] + ' Hundred ' : '') + (x % 100 < 20 ? ones[x % 100] : tens[Math.floor(x % 100 / 10)] + (x % 10 ? '-' + ones[x % 10] : ''));
  const d = Math.floor(n), c = Math.round((n - d) * 100);
  const s = (d >= 1000 ? h(Math.floor(d / 1000)) + ' Thousand ' : '') + h(d % 1000);
  return (s.trim() || 'Zero') + ` and ${String(c).padStart(2, '0')}/100 dollars`;
}

const cardCharges = c => EXPENSES.filter(e => e.paid.includes(c.last4));
const cardSubs = c => SUBS.filter(s => s.card === c.last4);

// Checks before a card bill is paid. Autopay at the card company moves the money;
// the books make sure it's safe and records it.
function payChecks(c) {
  const missing = cardCharges(c).filter(e => !e.receipt).length;
  const opBal = BANKS[0].book;
  return [
    [missing ? `${missing} charge${missing > 1 ? 's still need' : ' still needs'} a receipt` : 'Every charge has a receipt', !missing],
    [`${bankLabel(BANK)} can cover it (${fmt(opBal, 0)} on hand)`, opBal - c.bal > (POL.cashCushion || 0)],
    ['Statement total matches the charges here', true],
  ];
}

    },
  };
};

  };
}
// Try a change on a copy; if the setup is still valid, run the real change and log it.
function changeSetup(what, onCopy, apply) {
  const draft = currentSetup(); onCopy(draft);
  const problems = BooksSetup.validateSetup(draft);
  if (problems.length) { const box = $('#setProb'); if (box) box.innerHTML = `<div class="note" style="background:var(--red-soft);color:var(--red-ink);margin-bottom:12px"><b>Not saved:</b><br>${problems.map(esc).join('<br>')}</div>`; else toast('Not saved: ' + problems[0]); return false; }
  try { apply(); } catch (err) { toast('Not saved: ' + err.message); return false; }
  logSetup(what);
  closePanel(); render(); toast('Saved · ' + what); return true;
}

      ${Object.keys(NOTIFY_LABEL).filter(k => NOTIFY[k]).map(k => { const r = NOTIFY[k]; return `<div class="fund"><div class="nm">${NOTIFY_LABEL[k]}<small>${r.on ? `${r.via === 'text' ? 'Text' : 'Email'} to ${andList(r.to.map(x => ({ approvers: 'approvers', admins: 'admins', lead: "the budget's leader", holder: 'the cardholder' })[x] || (PEOPLE[x] ? esc(PEOPLE[x].name) : x)))}${k === 'weekly' ? ` · ${['Sundays', 'Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays'][r.day]} at ${r.hour}:00` : ''}${k === 'budgets' ? ` · at ${r.thresholds.join('% and ')}%` : ''}${k === 'bills' ? ` · ${r.before.join(' and ')} days before` : ''}` : 'Off'}</small></div><span class="pill ${r.on ? 'green' : 'gray'}">${r.on ? 'On' : 'Off'}</span><button class="linkbtn" data-setnotify="${k}">Edit</button></div>`; }).join('')}</div>`,

      ${SETUP_LOG.slice().reverse().map(l => `<div class="fund"><span class="mono small">v${l.v}</span><div class="nm" style="font-weight:500">${esc(l.what)}<small>${esc(l.by)} · ${esc(l.on)}</small></div></div>`).join('')}</div>

const RULES_FIELDS = [['lookClosely.amount', 'Flag for a closer look at', '$'], ['reimburseWithinDays', 'Reimbursements turned in within', 'days'], ['countersRequired', 'People who count each offering', ''],

  .map(([k, l, u]) => [k, l, u]);
Object.defineProperty(POL, 'lookClosely.amount', { get: () => (POL.lookClosely || {}).amount, set: v => { POL.lookClosely = { ...(POL.lookClosely || {}), amount: v }; }, enumerable: false });

const COLORS = ['#2557b8', '#2e7a52', '#b5892a', '#7b5ea7', '#3b8ea5', '#c0603a', '#5b7d2e', '#8a4f9e', '#a8352f'];

P.setfund = id => { const f = id ? fund(id) : { name: '', restriction: 'with', color: COLORS[FUNDS.length % COLORS.length] };

        else { const nid = 'f' + Date.now().toString(36), restriction = $('#sfR').value;

          changeSetup(`Fund "${name}" added`, d => d.funds.push(nf), () => { BOOKS.addFund({ id: nid, name, restriction: r, ...(designated ? { designated: true } : {}) }, ME); FUNDS.push({ ...nf, kind: kindOf(nf), bal: 0, ytdIn: 0, ytdOut: 0 }); }); }

P.setbank = () => ({ kicker: 'Settings', ...setForm(`<h2>Add a bank account</h2>

P.setperson = id => { const p = id ? PEOPLE[id] : { name: '', role: '', phone: '' }, has = (arr, x) => (arr || []).includes(x);
  const box = (k, label, on) => `<label class="chk" style="cursor:pointer"><input type="checkbox" data-role="${k}" ${on ? 'checked' : ''} style="width:18px;height:18px;accent-color:var(--blue)"><span>${label}</span></label>`;
  return { kicker: 'Settings', ...setForm(`<h2>${id ? esc(p.name) : 'Add a person'}</h2>
    <div class="row2"><div class="f"><label>Name</label><input id="spN" value="${esc(p.name)}"></div><div class="f"><label>Role or title</label><input id="spR" value="${esc(p.role || '')}"></div></div>
    <div class="row2"><div class="f"><label>Mobile (for receipt texts)</label><input id="spP" value="${esc(p.phone || '')}"></div><div class="f"><label>Paid back by</label><select id="spB"><option value="">Check</option><option value="ACH" ${p.payBack && p.payBack.method === 'ACH' ? 'selected' : ''}>ACH (they add bank details securely)</option></select></div></div>
    <div class="section"><h3>Roles</h3>${box('reviewer', 'Reviews receipts', has(REVIEWERS, id))}${box('approver', 'Approves spending', has(POL.approvers, id))}${box('signer', 'Signs checks', has(CK.signers, id))}${box('admin', 'Admin — can change settings', has(SETUP.admins, id))}</div>`, 'spSave'),
    init() { $('#spSave').onclick = () => {
      const pid = id || 'p' + Date.now().toString(36), v = { name: clean($('#spN').value), role: clean($('#spR').value), phone: clean($('#spP').value) };

      if (!v.name) { toast('Add a name'); return; }
      const setRole = (arr, on) => { const i = arr.indexOf(pid); if (on && i < 0) arr.push(pid); if (!on && i >= 0) arr.splice(i, 1); };
      changeSetup(id ? `${v.name} updated` : `${v.name} added`, d => {
        d.people[pid] = { ...(d.people[pid] || {}), ...v, payBack: pb };
        setRole(d.policies.reviewers, roles.reviewer); setRole(d.policies.approvers, roles.approver); setRole(d.checks.signers = d.checks.signers || [], roles.signer); setRole(d.admins = d.admins || [], roles.admin);
      }, () => {
        PEOPLE[pid] = { ...(PEOPLE[pid] || { card: null }), ...v, payBack: pb };
        setRole(REVIEWERS, roles.reviewer); setRole(POL.approvers, roles.approver); setRole(CK.signers = CK.signers || [], roles.signer); setRole(SETUP.admins = SETUP.admins || [], roles.admin);
      });
    }; } }; };

P.setcat = label => { const code = label ? SETUP.categories[label] : '';

          () => { if (newAcct) { BOOKS.addAccount(newAcct, ME); SETUP.extraAccounts = [...(SETUP.extraAccounts || []), newAcct]; } if (label && label !== name) delete SETUP.categories[label]; SETUP.categories[name] = acct; });

P.setrules = () => ({ kicker: 'Settings', ...setForm(`<h2>Rules &amp; limits</h2>
    ${RULES_FIELDS.map(([k, label, unit]) => `<div class="f"><label>${label}${unit && unit !== '$' ? ' (' + unit + ')' : ''}</label><input type="number" data-rule="${k}" value="${POL[k] == null ? '' : POL[k]}"></div>`).join('')}
    <div class="f"><label>Receipt reminders (days after a charge)</label><input id="srRem" value="${(POL.receiptReminders || []).join(', ')}"></div>`, 'srSave'),
  init() { $('#srSave').onclick = () => {
    const vals = Object.fromEntries([...document.querySelectorAll('[data-rule]')].map(i => [i.dataset.rule, i.value === '' ? null : +i.value]));
    const rem = $('#srRem').value.split(',').map(x => +x.trim()).filter(x => x >= 0);
    if (Object.values(vals).some(v => v != null && (isNaN(v) || v < 0))) { toast('Numbers only, zero or more'); return; }
    changeSetup('Rules & limits', d => { Object.entries(vals).forEach(([k, v]) => { if (k === 'lookClosely.amount') d.policies.lookClosely = { amount: v }; else d.policies[k] = v; }); d.policies.receiptReminders = rem; },
      () => { Object.entries(vals).forEach(([k, v]) => { POL[k] = v; }); POL.receiptReminders = rem; });
  }; } });

function exportSetup() {
  const s = currentSetup(), body = JSON.stringify(s, null, 2);
  const text = `// Church setup — ${s.name}. Exported ${TODAY} by ${ME}.\n(function (root, data) {\n  if (typeof module === 'object' && module.exports) module.exports = data;\n  else root.CHURCH_SETUP = data;\n})(typeof self !== 'undefined' ? self : this, ${body});\n`;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/javascript' })); a.download = `${s.id}-setup.js`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return text;
}

/* ---------- Recurring payments ----------
   Approved once on the yearly total, then paid on schedule: automatically, or with one click.
   Date math lives in engine/schedule.js. */
const SCHED = BooksSchedule;
const SCHEDULES = copy(SAMPLE.schedules || []);
const yearlyOf = s => s.amt * SCHED.perYear(s.every);
const schedProxy = s => ({ amt: yearlyOf(s), proj: s.proj, acct: s.acct, get approvals() { return s.approvals; }, set approvals(v) { s.approvals = v; } });
const schedApproved = s => apStatus(schedProxy(s), null).done;
const dueNow = s => s.status === 'Active' && schedApproved(s) ? SCHED.due(s, TODAY) : [];
const manualDue = () => SCHEDULES.flatMap(s => s.auto ? [] : dueNow(s).map(d => ({ s, d })));
// What's still scheduled for the rest of the year in a budget (rolls up like everything else)
const scheduledLeft = p => sum(SCHEDULES.filter(s => s.status === 'Active' && s.proj === p.name && schedApproved(s)).map(s => SCHED.between(s, TODAY, `${YEAR}-12-31`).length * s.amt)) + sum(kids(p).map(scheduledLeft));

function runSchedule(s, date, how) {
  const v = vendor(s.vendor), when = BOOKS.isLocked(date) ? TODAY : date;
  const base = { proj: s.proj, fund: project(s.proj).fund, category: s.acct };
  let rec;
  if (s.method === 'Check') {
    const c = queueCheck({ payee: v.name, address: v.address || '', amt: s.amt, memo: `${s.what} · ${short(new Date(date + 'T12:00:00'))}`, ...base, scheduleId: s.id,
      detail: [{ what: `${s.what} (${SCHED.LABEL[s.every].toLowerCase()})`, amt: s.amt }] });
    rec = { date, method: 'Check', checkId: c.id, how };
  } else {
    const je = BOOKS.post(R.bankPayment({ date: when, memo: `${v.name} · ${s.what} (${short(new Date(date + 'T12:00:00'))})`, source: { type: 'schedule', id: `${s.id}|${date}` }, party: v.name,
      amount: cents(s.amt), expense: EXPENSE_ACCT[s.acct] || '5100', fund: base.fund, project: s.proj, bank: BANK }), ME);
    rec = { date, method: 'ACH', je: je.id, how };
  }
  (s.history = s.history || []).push(rec); s.lastRun = date;
  return rec;
}
